<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBGI Field and Lab Apps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono&display=swap">
<style>
:root{--green:#3E503C;--sage:#7F886A;--cream:#F3ECDB;--orange:#FF6F3D;--ink:#1F2A1E;--mute:#566052;--line:#E4DFD0;--bg:#F7F5EE;--paper:#fff;--warn:#9A3412;--req:#C9461F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#F7F5EE}}
:root[data-theme="dark"]{--bg:#F7F5EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fira Sans',system-ui,sans-serif}
.top{display:flex;align-items:center;gap:1.5rem;padding:1rem 1rem;max-width:72rem;margin:0 auto;flex-wrap:wrap}
.top h1{font-size:1.15rem;font-weight:500;color:var(--green);margin:0;flex-grow:1}
.sw{display:flex;border:1px solid var(--green)}
.sw button{border:0;background:#fff;color:var(--green);font:inherit;padding:.6rem 1.1rem;cursor:pointer;min-height:44px}
.sw button.on{background:var(--green);color:#fff}
.wrap{display:flex;gap:3rem;justify-content:center;align-items:flex-start;padding:1rem 1rem 3rem;max-width:72rem;margin:0 auto;flex-wrap:wrap}
.phone{width:390px;height:844px;background:#fff;border:10px solid #1F2A1E;border-radius:2.2rem;overflow:hidden;position:relative;display:flex;flex-direction:column;flex-shrink:0;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.side{max-width:24rem;font-size:.95rem;line-height:1.55;color:var(--mute)}
.side h2{color:var(--green);font-weight:500;font-size:1.1rem;margin:0 0 .5rem}
.side ul{padding-left:1.1rem}
@media (max-width:30rem){.phone{width:100%;height:calc(100vh - 5rem);border:0;border-radius:0;box-shadow:none}.wrap{padding:0}.side{padding:0 1rem}}
/* app */
.bar{background:var(--green);color:#fff;padding:.85rem 1rem;display:flex;align-items:center;gap:.75rem;min-height:56px;flex-shrink:0}
.bar b{font-size:1.1rem;font-weight:500;flex-grow:1}
.bar small{opacity:.85;font-size:.8rem}
.ib{background:none;border:0;color:inherit;font-size:1.4rem;min-width:44px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.tabs{display:flex;background:var(--green);flex-shrink:0}
.tabs button{flex:1;background:none;border:0;color:#fff;opacity:.7;font:inherit;font-size:.85rem;padding:.75rem 0;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{opacity:1;border-bottom-color:var(--orange)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:4px;vertical-align:middle}
.body{flex-grow:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.foot{padding:.75rem 1rem;border-top:1px solid var(--line);display:flex;gap:.6rem;flex-shrink:0;align-items:center}
.l{font-size:.8rem;color:var(--mute);margin:0 0 .35rem;display:block}
.r{color:var(--req)}
.a{font-size:.68rem;color:var(--green);background:var(--cream);padding:1px 6px;margin-left:4px;white-space:nowrap}
.i{border:1px solid #C9C3AE;padding:.65rem .75rem;font:inherit;font-size:1rem;min-height:44px;background:#fff;width:100%;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.c{border:1px solid #C9C3AE;background:#fff;padding:.55rem .75rem;font:inherit;font-size:.88rem;color:var(--ink);min-height:44px;cursor:pointer}
.c.on{background:var(--green);border-color:var(--green);color:#fff}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.75rem}.g2 .i{min-width:0}
.btn{border:0;background:var(--green);color:#fff;font:inherit;font-size:1rem;min-height:50px;cursor:pointer;flex:1;padding:0 1rem}
.btn.hot{background:var(--orange);color:var(--ink);font-weight:500}
.btn.sec{background:#fff;border:1px solid var(--green);color:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.box{background:var(--bg);padding:.75rem;font-size:.82rem;color:var(--mute);line-height:1.6}
.box b{color:var(--ink);font-weight:500}
.mono{font-family:'Fira Mono',monospace}
.lead{margin:0;font-size:.88rem;color:var(--mute);line-height:1.45}
.h{font-size:.95rem;font-weight:500;margin:.25rem 0 0}
.row{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.85rem}
.warn{color:var(--warn)}
.ok{color:var(--green)}
.toast{position:absolute;left:1rem;right:1rem;bottom:5.5rem;background:var(--ink);color:#fff;padding:.75rem 1rem;font-size:.88rem;z-index:5}
/* map */
.map{position:relative;flex-grow:1;overflow:hidden;background:#EEF0E6}
.map .ortho{position:absolute;left:-20%;top:28%;width:140%;height:52%;background:linear-gradient(135deg,#9AAE7E,#7E9467 40%,#B9B39A 60%,#8DA273);transform:rotate(-28deg);opacity:.85}
.pt{position:absolute;width:16px;height:16px;border-radius:50%;border:1.5px solid #fff;background:var(--orange);transform:translate(-50%,-50%)}
.pt.s{background:var(--green)}
.lb{position:absolute;font-size:.8rem;color:var(--ink);background:rgba(255,255,255,.75);padding:0 3px;transform:translate(10px,-50%);white-space:nowrap}
.cross{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border:2px solid var(--ink);border-radius:50%;pointer-events:none}
.cross:before,.cross:after{content:'';position:absolute;background:var(--ink)}
.cross:before{left:50%;top:12px;bottom:12px;width:2px;margin-left:-1px}.cross:after{top:50%;left:12px;right:12px;height:2px;margin-top:-1px}
.rb{position:absolute;width:52px;height:52px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sess{position:absolute;left:76px;right:12px;top:12px;background:#fff;padding:.5rem .75rem;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:.78rem;color:var(--mute);border:0;text-align:left;font-family:inherit;cursor:pointer}
.sess b{display:block;color:var(--ink);font-size:.92rem;font-weight:500}
/* photos */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.ph button{aspect-ratio:3/4;border:0;background:var(--cream);font:inherit;font-size:.72rem;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.ph button b{font-size:.82rem;color:var(--ink);font-weight:500}
.ph button.ok{background:var(--green);color:#E4E9DF}.ph button.ok b{color:#fff}
/* lab */
.mod{display:flex;align-items:center;gap:.9rem;padding:.85rem 1rem;border:0;border-bottom:1px solid var(--line);background:#fff;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%;min-height:60px}
.n{width:32px;height:32px;border-radius:50%;background:var(--cream);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:500;flex-shrink:0;font-size:.85rem}
.n.d{background:var(--green);color:#fff}
.n.w{background:#fff;border:2px solid var(--orange);color:var(--ink)}
.q{text-align:right;font-size:.75rem;color:var(--mute)}.q b{display:block;font-size:1.1rem;font-weight:400;color:var(--green)}
.scale{border:2px solid var(--green);padding:1.2rem 1rem;text-align:center}
.scale .v{font-size:3.6rem;font-weight:300;color:var(--green);line-height:1.1}
.meter{height:10px;background:var(--line);position:relative;margin:.7rem 0 .3rem}
.meter i{position:absolute;left:30%;width:40%;height:100%;background:#C5D1BC}
.meter s{position:absolute;top:-4px;width:3px;height:18px;background:var(--green)}
.prog{height:8px;background:var(--line)}.prog i{display:block;height:100%;background:var(--green)}
.step{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.step .d{font-size:.75rem;color:var(--mute)}
.rmap{display:grid;gap:2px;font-size:.6rem}.rmap .axb{border:0;background:none;cursor:pointer;font:inherit;padding:0;text-decoration:underline dotted}.rmap .ax{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:.65rem}.cell{aspect-ratio:1;border:0;background:var(--line);font:inherit;font-size:.55rem;padding:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Fira Mono',monospace}.cell.f{background:var(--green)}.cell.n{background:var(--orange);color:var(--ink);font-family:inherit}.cell.x{background:#fff;border:1px dashed #C9C3AE;color:#999}
.mv{width:30px;height:30px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--green);cursor:pointer;padding:0}.mv:disabled{opacity:.3}
.scanbox{border:2px dashed var(--sage);background:#fff;color:var(--green);font:inherit;padding:1.2rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;cursor:pointer;width:100%}.scanbox span{font-size:1.05rem;font-weight:500}.scanbox small{color:var(--mute);font-size:.72rem}
input[type=range]{width:100%;accent-color:var(--green);height:32px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}

/* look natif téléphone : police système, puces Material, champs arrondis */
body,.phone,button,input,select,textarea{font-family:Roboto,'Segoe UI',system-ui,-apple-system,sans-serif}
.mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace}
.i{border-radius:8px;border-color:#B9B4A3}
.c{border-radius:999px;padding:.45rem .95rem;min-height:36px;font-size:.85rem;border-color:#B9B4A3}
.c.on{background:#DDE5D6;border-color:#DDE5D6;color:var(--ink);font-weight:500}
.c.on:before{content:'✓ ';color:var(--green)}
.chips{gap:.5rem}
.btn{border-radius:999px;min-height:48px;font-weight:500}
.box{border-radius:12px}
.scanbox{border-radius:12px}
.mv{border-radius:6px}
.toast{border-radius:6px}

/* labo : gros boutons pour les gants */
.glove .btn{min-height:60px;font-size:1.05rem}
.glove .c{min-height:48px;padding:.6rem 1.1rem;font-size:.95rem}
.glove .i{min-height:52px;font-size:1.05rem}
.glove .mv{width:44px;height:44px;font-size:1.1rem}
.glove .mod{min-height:68px;font-size:1.02rem}
.glove .scanbox{min-height:9rem}
.glove .ib{min-width:52px;min-height:52px}
.glove input[type=checkbox]{width:26px!important;height:26px!important}
.glove .cell{font-size:.6rem}
</style>
</head>

<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let APP='field';
const now=()=>new Date().toTimeString().slice(0,5);
/* ---------- état ---------- */

const PACK={'Liquid N2':'Aluminium foil','Dry ice':'Aluminium foil','Silica gel':'Tea bag / filter paper bag','Oven':'Paper envelope','Air':'Paper envelope','Field extraction':'Microtube 2 mL','Ethanol':'Microtube 2 mL'};

const F={prev:[{id:'batch_000027',d:'Yesterday',n:70,def:'2026-11-09T17:40',in:''},{id:'batch_000026',d:'Sun 8 Nov (silica)',n:80,def:'2026-11-10T09:00',in:''}],scr:'login',user:'',srv:'https://emi-collection.unifr.ch',proj:'',tab:0,toast:'',
 s:{garden:'Neuchâtel (JBN)',collector:'Mazzarine Laboureau',pres:'Liquid N2',pack:'Aluminium foil',trans:'Liquid N2',dur:'< 8 h',ident:'Garden label',soil:'Rock garden',weather:'Sunny'},
 done:[{id:'dbgi_007029',t:'Gentiana lutea L.',x:28,y:44,sent:1},{id:'dbgi_007030',t:'Saxifraga paniculata Mill.',x:36,y:57,sent:1},{id:'dbgi_007028',t:'Abies nordmanniana',x:62,y:40,sent:0}],cur:null};

const SIDE={
f_login:['Sign in','Same account as Directus. The Fribourg server is filled in; another team can change it.'],
f_projects:['Projects','All your QField projects on the server. Opening one downloads it, so the app works without network in the garden.'],
f_session:['Today’s session','Filled once per field day: garden, collector, preservation, packaging, transport, identification. Every sample of the day inherits it, so these method fields never have to be chased afterwards. The field printer is connected here.'],
f_map:['Map','Like QField: crosshair, sample labels, tools on the left, green + to add a sample. The counter shows what is not sent yet.'],
f_form0:['Plant','Scan the tube, type a few letters of the taxon: the garden list gives the name and the IPEN. GPS, time and collector are recorded for you. A dot on a tab means something required is missing.'],
f_form1:['Site','Herbivory, soil, weather and comments. Soil and weather stay set for the next plant, like the pin in QField. Air temperature comes from a weather station.'],
f_form2:['Preservation','Taken from the session; change it only for an odd sample. Cut time = when the “cut” photo is taken; freezing time = when the sample is saved and sent. The fields change with the method (silica, field extraction…).'],
f_form3:['Photos','The six DBGI photos. They go to iNaturalist with the tag emi_external_id, so the portal links each sample to its observation. The panel_label photo is checked against the scan and the taxon.'],
f_sync:['Send','Each field day becomes a collection batch automatically. The app asks when the box goes into the freezer, and asks again later for days still missing (silica, long trips): day and time, no rescanning.'],
l_login:['Sign in','Directus account, Fribourg server by default.'],
l_home:['Modules','One module per bench step, as in EMI. The wifi switch shows offline work: scans are kept on the phone and synced later. The printer status is always top right.'],
l_printer:['Field printer','Connect once; every module prints its labels through it. The same printer works in the field app.'],
l_batches:['Batches','Only extraction batches are made by hand, with a short description and a description as in Directus. Creating one prints the blank label for the vials, which can be reprinted. Collection, aliquots, project and ms batches are made automatically.'],
l_reception:['Reception','One line per field day. Say when the box went into the freezer, day and time; the transport duration is computed from the field freezing times. Usually already answered in the field app.'],
l_preparation:['Preparation','Drying: one entry per project, no tube tracking. Fill a rack: scan a rack label (new ones get a rack type), the app counts free places, fill A1, B1, C1… or tap where to start; tap a tube to rescan it. Move a tube: from one rack to another. Rack types are added through a curator.'],
l_newrack:['New rack type','The name is built from the fields, a photo is required and look-alikes are flagged, so the same rack never gets two names. Usable at once, checked by a curator.'],
l_curator:['Curator','Approve, merge into an existing type (racks are moved over) or refuse each proposal.'],
l_weighing:['Weighing','Scan, type the weight, print, next tube. The weight range is optional and set per batch. Grinding settings sit here because the beads go in at weighing. Any weight can be corrected; the old value is kept.'],
l_extraction:['Extraction','Pick the extraction batch, set the liquid and volume once (plus agitation, centrifugation, filtration, storage), then scan each tube and stick the new label.'],
l_aliquoting:['Aliquoting','Upload the injection order (blk, qc, sample…) or build it by hand, and move lines up or down. Each scanned sample fills the next sample slot and prints its vial label. Validating the plate creates the aliquots batch and keeps the CSV in order.'],
l_summary:['Batch check','The required method fields of a batch, filled or missing, and in which module. LC-MS settings come from the RAW / mzML files at deposit.'],
l_search:['Search','Type or scan a sample: rack, position and the rack map with the tube highlighted.']};

 if(LA==='drh'){L.dr.h+=12;render()}
 if(LA==='drstop'){L.dr.done.push([L.dr.n,L.dr.h]);L.dr.run=false;L.dr.n=0;toast(L,'Run stopped: duration saved. Tubes are ready for Fill a rack.')}
 if(LA==='gropen'){L.gr.open=!L.gr.open;render()}
 if(LA==='timer')toast(L,`Timer started: ${L.exs.agmin} min. The time is saved on the batch.`);
 if(LA==='msok'){const id='batch_'+pad(31+L.batches.length-3);L.batches.unshift([id,'ms',L.ms.meth,`${L.ms.lc} · ${L.ms.col} · ${L.ms.pol}`]);toast(L,id+' created. RAW files will link to it by name.')}
 if(LA==='sync'){L.off.q=0;toast(L,'Synced with Directus.')}
 if(LA==='mvstart'){L.mv={};render()}
 if(LA==='mvcancel'){L.mv=null;L.pmode='fill';render()}
 if(LA==='mvtube'){const r=L.racks.RACK_0040,ps=Object.keys(r.tubes),p=ps[Math.floor(Math.random()*ps.length)];L.mv={id:r.tubes[p],from:'RACK_0040',fp:p};render()}
 if(LA==='mvrack'){L.mv.to='RACK_0041';L.mv.tp=null;render()}
 if(LA==='mvok'){const m=L.mv;delete L.racks[m.from].tubes[m.fp];L.racks[m.to].tubes[m.tp]=m.id;L.mv=null;toast(L,`${m.id}: ${m.from} ${m.fp} → ${m.to} ${m.tp}`)}
 if(LA==='fromreset'){L.racks[L.rack.label].from=0;render()}
 if(LA==='cellrescan'){const r=L.racks[L.rack.label],old=r.tubes[L.cell],id=nid();r.tubes[L.cell]=id;toast(L,`${L.cell}: ${old} replaced by ${id}.`)}
 if(LA==='cellempty'){const r=L.racks[L.rack.label],old=r.tubes[L.cell];delete r.tubes[L.cell];toast(L,`${old} removed from ${L.cell}. The next scan fills it.`)}
 if(LA==='blank'){const n=+($('#bl'+d.i)||{value:1}).value||1;toast(L,L.pr.on?`${n} blank label${n>1?'s':''} printed: ${d.id}_blank`:'No printer connected: connect one to print the blank labels.')}
 if(LA==='fix'){L.fix=true;render()}
 if(LA==='fixok'){const r=L.racks[L.rack.label],v=+$('#fx').value,used=Object.keys(r.tubes).length;r.off=Math.max(0,r.rows*r.cols-used-v);L.fix=false;toast(L,`${v} free places saved.`)}
 if(LA==='rkcancel'||LA==='rkclose'){if(LA==='rkclose')toast(L,`${L.rack.label} closed.`);L.rack={label:''};L.cell='';L.fix=false;render()}
 if(LA==='wscan'){const t=TAXA[L.nx%TAXA.length];L.w.id=nid();L.w.val='';L.w.sp=t[0]+' · leaf · freeze-dried';render()}
 if(LA==='wcancel'){L.w.id='';render()}
 if(LA==='wprint'){const w=L.w;w.done.push([w.id,(+w.val).toFixed(1)]);const id=w.id+'_01';w.id='';w.val='';toast(L,lbl(id)+' Scan the next tube.')}
 if(LA==='exscan'){const id=nid();L.ex.done.push(id);toast(L,lbl(id+'_01'))}
 if(LA==='alblank'){L.al.list.push(['blank']);render()}
 if(LA==='alqc'){L.al.list.push(['QC']);render()}
 if(LA==='alscan'){const id=nid(),k=nextSlot();if(k>=0)L.al.list[k][1]=id;else L.al.list.push(['sample',id]);toast(L,lbl(id+'_01_01')+' → '+wellOf(k>=0?k:L.al.list.length-1))}
 if(LA==='altpl'){L.al.list=parseOrder('blk qc sample sample sample sample sample qc sample sample sample sample sample qc blk');toast(L,'Example order loaded: 15 lines, 10 sample slots.')}
 if(LA==='alok'){const id='batch_'+pad(31+L.batches.length-3),n=L.batches.filter(b=>b[1]==='aliquots').length+1,s=L.al.list.filter(r=>r[0]==='sample').length;L.batches.unshift([id,'aliquots',`plate ${n}`,`${s} samples, ${L.al.list.length} injections, ${L.al.vol} µL`]);L.al.list=[];toast(L,`Plate validated: ${id} created with its CSV.`)}
 if(LA==='alclear'){L.al.list=[];render()}
 if(LA==='alpaste'){const r=parseOrder($('#alpaste').value);if(!r.length){toast(L,'Nothing recognised: use blk, qc or sample, one per line.');return}L.al.list=r;toast(L,`Order loaded: ${r.length} lines.`)}
 if(LA==='alcsv'){const t=alCsv();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(L,'CSV copied: paste it into the instrument sequence.'),()=>toast(L,'Select the CSV text to copy it.'))}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.alfile&&t.files[0]){t.files[0].text().then(x=>{const r=parseOrder(x);if(!r.length){toast(L,'No blk / qc / sample found in the file.');return}L.al.list=r;toast(L,`${t.files[0].name}: ${r.length} lines loaded.`)})}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.in){const v=t.type==='range'?+t.value:t.value;setPath(d.in,v);if(d.in==='cur.q'){F.cur.taxon=F.cur.manual?v:'';render();const x=$('#tx');x.focus();x.setSelectionRange(v.length,v.length)}else if(d.in==='cur.herb'){$('#hbv').textContent=v}else if(t.tagName==='SELECT')render()}
 if(d.lin)L[d.lin]=t.value;
 if(d.off){L.off.on=!t.checked;render()}
 if(d.wrng){if(d.wrng==='on'){L.w.on=t.checked;render()}else{L.w[d.wrng]=t.value;const m=$('#wmsg');if(m)m.innerHTML=wmsg(L.w)}}
 if(d.lin2){const [o,k]=d.lin2.includes('.')?d.lin2.split('.'):[null,d.lin2];if(o)L[o][k]=t.value;else L[k]=t.value;
  if(d.lin2==='w.val'){$('#wmsg').innerHTML=wmsg(L.w);$('[data-lact=wprint]').disabled=t.value===''}
  else if(['nrt.r','nrt.c','nrt.man'].includes(d.lin2)){const id=t.id;render();const x=$('#'+id);x.focus();x.setSelectionRange(x.value.length,x.value.length)}
  else if(d.lin2==='q'){render();const x=$('#sq');x.focus();x.setSelectionRange(x.value.length,x.value.length)}
  else if(d.lin2==='al.vol'||d.lin2==='al.fac'){const p=document.querySelector('pre');if(p)p.textContent=alCsv()}}
 if(d.chk){setPath(d.chk,t.checked);if(d.chk==='cur.manual'&&t.checked&&F.cur.q){F.cur.taxon=F.cur.q;F.cur.fam='to check'}render()}
});
render();
</script>
</body>
