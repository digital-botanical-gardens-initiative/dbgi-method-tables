function renderExample(){
  const el = document.getElementById("ms_example"), e = x => String(x ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const R = MEX.rows; window._exHide = window._exHide ?? true;
  const used = col => R.some(r => (r.cells[col.key] || [])[0]);
  const C = window._exHide ? MEX.cols.filter(used) : MEX.cols;
  const SC = s => s.startsWith("Directus") ? "src-dr" : (s.startsWith("people") ? "src-hu" : "src-fi");
  const vis = (r, c) => { const d = (c.dep || "").trim(); if (!d) return true; let m;
    if ((m = d.match(/^(\w+)\s+in\s+\((.*)\)$/))) return m[2].split(";").map(s => s.trim()).includes((r.cells[m[1]] || [])[1] || "");
    if ((m = d.match(/^(\w+)\s*(!=|=)\s*(.+)$/))){ const v = (r.cells[m[1]] || [])[1] || ""; return m[2] === "=" ? v === m[3].trim() : (v !== "" && v !== m[3].trim()); }
    return true; };
  const steps = []; C.forEach(c => { const l = steps[steps.length - 1]; if (l && l[0] === c.step) l[1]++; else steps.push([c.step, 1]); });
  let h = `<h1>Example table</h1><p class="intro">One row per sample, one column per step, and in each cell only the number of the option chosen (its id in the vocabulary sheet). Hover a number to see the value; click it to open the sheet. Header colour = where the value comes from; bold header = core, light = optional. <b>·</b> = step does not apply (option not chosen upstream), — = not known yet.</p>
   <div class="legend"><span><i class="sw" style="background:#0F6E56"></i>mzML / RAW file</span><span><i class="sw" style="background:#185FA5"></i>Directus</span><span><i class="sw" style="background:#D85A30"></i>people</span><span><b>bold</b> = core</span><span style="opacity:.6">light = optional</span></div>
   <p><button type="button" id="exToggle" class="lvlbtn">${window._exHide ? `Show all ${MEX.cols.length} columns` : `Hide empty columns`}</button> <span style="opacity:.7">${C.length} columns shown</span></p><div class="tw"><table class="wide"><thead><tr class="band"><th colspan="2" class="bst">Sample</th>${steps.map(s => `<th colspan="${s[1]}" class="bst">${e(s[0])}</th>`).join("")}</tr>
   <tr class="cols"><th class="stk">sample_id</th><th>garden</th>${C.map(c => `<th class="${SC(c.source)} ${c.level === "core" ? "core" : "opt"}" title="${e(c.label)} · source: ${e(c.source)} · ${e(c.level)}"><span>${e(c.key)}</span></th>`).join("")}</tr></thead><tbody>`;
  let prev = "";
  for (const r of R){
    h += `<tr class="${r.garden !== prev ? "gstart" : ""}"><td class="stk">${e(r.sample_id)}</td><td>${e(r.garden)}</td>`; prev = r.garden;
    for (const c of C){
      const [id, v] = r.cells[c.key] || [];
      if (!vis(r, c)) h += `<td class="na">·</td>`;
      else if (id) h += `<td class="${c.level === "core" ? "core" : "opt"}"><button class="num" type="button" data-s="${e(c.vocab)}" title="${e(c.key)} = ${e(v)}">${e(id)}</button></td>`;
      else h += `<td class="unk" title="${e(v || "not known yet")}">—</td>`;
    }
    h += `</tr>`;
  }
  h += `</tbody></table></div>`;
  el.innerHTML = h;
  el.querySelector("#exToggle").onclick = () => { window._exHide = !window._exHide; renderExample(); };
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { document.querySelector('.topnav button[data-k="tables"]').click(); if (typeof open === "function") open(b.dataset.s); });
}

    (groups[s.group] ||= []).push([k,s]); });
  $("#nav").innerHTML = Object.entries(groups).map(([g, l]) => `<h3>${esc(g)}</h3>` + l.map(([k,s]) =>
    `<button data-k="${esc(k)}" class="lv${s.lvl||0}" aria-current="${k===cur}"><span>${(s.lvl||0) > 0 ? '<i class="br">' + ((s.lvl||0) > 1 ? "&nbsp;&nbsp;&nbsp;└" : "└") + '</i> ' : ""}${esc(s.title)}</span><span class="n">${s.rows.length}</span></button>`).join("")).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => open(b.dataset.k));
}
function open(k){ cur = k; try{ history.replaceState(null, "", "#" + k); }catch(e){} renderNav(); renderSheet(); }

function renderSheet(){
  const s = sheets[cur]; if (!s){ cur = "protocole"; return sheets[cur] && renderSheet(); }
  if (cur === "protocol_tree"){
    const src = document.querySelector("#ms_structure .metro-wrap");
    $("#sheet").innerHTML = `<div class="eyebrow">Overview</div><h2>${esc(s.title)}</h2><div class="desc">${esc(s.description)}</div>
      <div class="tools" id="treetools"><span class="hint">Detail:</span> <button class="btn small lvl" type="button" data-l="methods">6 method keys</button> <button class="btn ghost small lvl" type="button" data-l="core">Core parameters</button> <button class="btn ghost small lvl" type="button" data-l="all">Everything</button> <button class="btn ghost small" type="button" id="treefit">Fit to width</button></div>
      <div class="metro-wrap" id="treebox">${src ? src.innerHTML : ""}</div>`;
    if (typeof setupLevels === "function") setupLevels($("#sheet"));
    $("#treefit").onclick = e => { const w = $("#treebox"); w.classList.toggle("fit"); e.target.textContent = w.classList.contains("fit") ? "Actual size" : "Fit to width"; };
    return;
  }
  const usedCol = s.columns.findIndex(c => /used in dbgi/i.test(c));
  const linkCol = s.columns.findIndex(c => /^(link|values sheet|sheets)$/i.test(c));
  $("#sheet").innerHTML = `
    <div class="eyebrow">${esc(s.group)} · ${esc(cur)}_sheet.csv</div>
    <h2>${esc(s.title)}</h2>
    <div class="desc" contenteditable="true" id="desc" aria-label="Sheet description">${esc(s.description) || "<span class='hint'>Add a description…</span>"}</div>
    <div class="tools"><button class="btn" id="addrow" type="button">+ Add row at the end</button>
      <span class="hint">"+" on a row inserts a new row just below it · Click a cell to edit · Tab / Enter to move on · edited rows get an orange mark · links open the sheet</span></div>
    <div class="tablebox"><table><thead><tr>${s.columns.map(c => `<th>${esc(c)}</th>`).join("")}<th></th></tr></thead><tbody></tbody></table></div>
    <div class="tools"><button class="btn ghost" id="addrow2" type="button">+ Add row</button></div>`;
  const tb = $("#sheet tbody");
  s.rows.forEach((r, i) => {
    const tr = document.createElement("tr");
    if (usedCol >= 0 && r[usedCol]) tr.classList.add("used");
    if ((s.edited || []).includes(i)) tr.classList.add("edited");
    s.columns.forEach((c, j) => {
      const td = document.createElement("td");
      if (j === 0 && /^(id|parameter_id)$/.test(c)) td.className = "id";
      const target = j === linkCol && (r[j].match(/([\w-]+)_sheet\.csv/) || r[j].match(/garden_defaults_mapping/));
      if (target){ const key = Array.isArray(target) && target[1] ? target[1] : "garden_defaults_mapping";
        td.innerHTML = `<a data-k="${esc(key)}">${esc(r[j])}</a>`; td.querySelector("a").onclick = () => open(key); }
      else { td.contentEditable = "true"; td.textContent = r[j];
        td.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); td.blur(); } });
        td.addEventListener("blur", () => { const v = td.textContent; if (v !== s.rows[i][j]) saveCell(i, j, v); }); }
      tr.appendChild(td); });
    const del = document.createElement("td"); del.style.whiteSpace = "nowrap"; del.innerHTML = `<button class="btn ghost small" type="button" title="Insert a row below">+</button> <button class="btn ghost small" type="button">Delete</button>`;
    del.querySelectorAll("button")[0].onclick = () => addRow(i + 1);
    let armed = false; del.querySelectorAll("button")[1].onclick = e => { if (!armed){ armed = true; e.target.textContent = "Confirm"; setTimeout(() => { armed = false; e.target.textContent = "Delete"; }, 3000); return; } deleteRow(i); };
    tr.appendChild(del); tb.appendChild(tr);
  });
  $("#addrow").onclick = () => addRow(); $("#addrow2").onclick = () => addRow();
  $("#desc").addEventListener("blur", e => { const v = e.target.innerText.trim(); if (v !== s.description && !(v === "Add a description…" && !s.description)) save({description: v}, "description", "", s.description, v); });
}
async function save(patch, what, where, oldV, newV){
  if (!db){ status("Read-only here: changes are not saved", "err"); return; }
  status("Saving…");
  try {
    await db.doc("sheets/" + cur).update(patch);
    await db.collection("changes").add({sheet: cur, what, where, old: String(oldV ?? ""), new: String(newV ?? ""), at: new Date().toISOString(), by: me});
    status("Saved " + new Date().toLocaleTimeString(), "ok");
  } catch(e){ status("Not saved: " + (e.code || e.message), "err"); }
}
function saveCell(i, j, v){
  const s = sheets[cur], old = s.rows[i][j]; s.rows[i][j] = v;
  const edited = [...new Set([...(s.edited || []), i])]; s.edited = edited;
  save({rows: s.rows.map(r => ({c: r})), edited}, "cell", `row ${i+1} · ${s.columns[j]}`, old, v);
}
function addRow(at){
  const s = sheets[cur], r = s.columns.map(() => ""); if (at == null) at = s.rows.length;
  if (/^(id|parameter_id)$/.test(s.columns[0])) r[0] = String(Math.max(0, ...s.rows.map(x => +x[0] || 0)) + 1);
  s.rows.splice(at, 0, r); s.edited = [...(s.edited || []).map(x => x >= at ? x + 1 : x), at];
  renderSheet(); save({rows: s.rows.map(r => ({c: r})), edited: s.edited}, "add row", `row ${at+1}`, "", r.join(" | "));
  const row = $("#sheet tbody").children[at]; const cell = row && [...row.children].find(td => td.isContentEditable && !td.classList.contains("id")); cell && cell.focus();
}
function deleteRow(i){
  const s = sheets[cur], old = s.rows[i]; s.rows.splice(i, 1);
  s.edited = (s.edited || []).filter(x => x !== i).map(x => x > i ? x - 1 : x);
  renderSheet(); save({rows: s.rows.map(r => ({c: r})), edited: s.edited}, "delete row", `row ${i+1}`, old.join(" | "), "");
}
$("#q").addEventListener("input", renderNav);
renderNav(); renderSheet(); status("Loaded · connecting to save edits…");

(async () => {
  try {
  if (!window.claude || !window.claude.use){ status("Runtime not available in this view", "err"); return; }
  status("Connecting to the store…");
  db = await window.claude.use("db");
  window.claude.use("user").then(u => u && u.id()).then(id => { me = id || ""; }).catch(() => {});
  if (!db){ status("Read-only: edits cannot be saved in this view", "err"); return; }
  db.collection("sheets").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const raw = d.data() || {}; const v = {...raw, edited: [...(raw.edited || [])], columns: [...(raw.columns || [])], rows: (raw.rows || []).map(r => { while (r && !Array.isArray(r)) r = r.c; return [...(r || [])]; })}; next[d.id] = v; });
    const editing = document.activeElement && document.activeElement.isContentEditable;
    sheets = Object.assign(JSON.parse(JSON.stringify(BASE)), next); for (const k in sheets) if (BASE[k]) { sheets[k].group = BASE[k].group; sheets[k].order = BASE[k].order; sheets[k].lvl = BASE[k].lvl; }
    renderNav(); if (!editing) renderSheet();
    if (!$("#status").className.includes("ok")) status(`${Object.keys(sheets).length} sheets loaded`, "ok");
  }, err => status("Load failed: " + (err.code || err.message), "err"));
  status("Loading sheets…");
  } catch(e){ status("Error: " + (e.code || e.message || e), "err"); }
})();
</script>
